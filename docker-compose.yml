services:
  mongo:
    image: mongo:latest
    container_name: grocery_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Smart_Grocery_Market/backend
    container_name: grocery_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smart_grocery_admin
      - JWT_SECRET=your_jwt_secret_key_here
    depends_on:
      - mongo

  admin_server:
    build: ./adminpanel/server
    container_name: grocery_admin_server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/smart_grocery_admin
      - JWT_SECRET=supersecretadminkey
    depends_on:
      - mongo

  adminpanel:
    build: ./adminpanel/adminpanel
    container_name: grocery_admin
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
